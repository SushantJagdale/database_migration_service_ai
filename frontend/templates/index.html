<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Discovery Hub & Database Migration with DMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #6b7280;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --light-gray: #f9fafb;
            --medium-gray: #e5e7eb;
            --dark-gray: #374151;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6; /* Softer, slightly darker gray */
            color: var(--dark-gray);
        }

        .header {
            background: linear-gradient(to right, #e0e7ff, #c7d2fe); /* Soft blue gradient */
            padding: 1rem 0;
            border: 2px solid #374151; /* Dark border */
            margin-bottom: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .header h1 {
            font-weight: 700;
            color: #373f51; /* Darker text for contrast */
        }

        .card {
            border: 2px solid #374151; /* Dark border */
            border-radius: 12px;
            /* Enhanced shadow for a stronger 3D effect */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), 0 6px 6px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            overflow: hidden;
            background-color: white;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15), 0 8px 10px rgba(0,0,0,0.1);
        }

        .card-header {
            background-color: #f9fafb;
            border-bottom: 1px solid var(--medium-gray);
            padding: 1.5rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .card-body {
            padding: 1.5rem;
        }

        .form-control {
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .spinner {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.3);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s ease infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #report-container {
            min-height: 500px;
            background-color: var(--light-gray);
            border-radius: 8px;
            padding: 1rem;
        }
        
        .alert {
            margin-top: 1rem;
        }
        .clock-spinner {
            display: inline-block;
            animation: spin 1.5s linear infinite;
            font-size: 1.2rem;
            margin-right: 8px;
        }
        .card-body-compact {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
    .card-header-sm {
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
        }

        .card-body-sm {
            padding: 0.75rem;
        }

        .form-group-sm {
            margin-bottom: 0.5rem;
        }

        .form-control-sm-custom {
            height: calc(1.5em + .5rem + 2px);
            padding: .25rem .5rem;
            font-size: .875rem;
        }

        .btn-sm-custom {
            padding: .25rem .5rem;
            font-size: .875rem;
            border-radius: .2rem;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container text-center">
            <h4>Discovery Hub & Database Migration with DMS</h4>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header card-header-sm">Configure AWS Credentials</div>
                        <div class="card-body card-body-sm">
                            <form id="configure-form">
                                <div class="form-group form-group-sm">
                                    <label for="aws_account_id" style="font-size: 0.9rem;">AWS Account ID</label>
                                    <input type="text" class="form-control form-control-sm-custom" id="aws_account_id" name="aws_account_id" required>
                                </div>
                                <div class="form-group form-group-sm">
                                    <label for="aws_access_key_id" style="font-size: 0.9rem;">AWS Access Key ID</label>
                                    <input type="text" class="form-control form-control-sm-custom" id="aws_access_key_id" name="aws_access_key_id" required>
                                </div>
                                <div class="form-group form-group-sm">
                                    <label for="aws_secret_access_key" style="font-size: 0.9rem;">AWS Secret Access Key</label>
                                    <input type="password" class="form-control form-control-sm-custom" id="aws_secret_access_key" name="aws_secret_access_key" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-sm-custom" id="configure-btn">
                                    <span class="spinner" id="configure-spinner"></span>
                                    <span id="configure-button-text">Configure AWS</span>
                                </button>
                                <div id="configure-result" class="mt-2"></div>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header card-header-sm">Discover Databases</div>
                        <div class="card-body card-body-sm">
                            <div class="form-group form-group-sm">
                                <label for="discover-prompt" style="font-size: 0.9rem;">Discovery Query</label>
                                <textarea class="form-control form-control-sm-custom" id="discover-prompt" rows="1" disabled>Discover all mysql and postgres databases from aws cloud</textarea>
                            </div>
                            <button id="discover-btn" class="btn btn-success btn-sm-custom" disabled>
                                <span class="spinner" id="discover-spinner"></span>
                                <span id="discover-button-text">Discover Databases</span>
                            </button>
                            <div id="discover-result" class="mt-2"></div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header card-header-sm">GCP DMS Migration Management</div>
                        <div class="card-body card-body-sm">
                            <form id="dms-form">
                                <div class="row">
                                    <div class="col-md-4 form-group form-group-sm">
                                        <label for="dms_job_name" style="font-size: 0.9rem;">DMS Migration Job Name</label>
                                        <input type="text" class="form-control form-control-sm-custom" id="dms_job_name" name="dms_job_name" placeholder="e.g. mysql-migration-job" required>
                                    </div>
                                    <div class="col-md-4 form-group form-group-sm">
                                        <label for="dms_region" style="font-size: 0.9rem;">GCP Region</label>
                                        <select class="form-control form-control-sm-custom" id="dms_region" name="dms_region" required>
                                            <option value="">Discover databases first</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4 form-group form-group-sm">
                                        <label for="dms_instance_id" style="font-size: 0.9rem;">Source Database Instance Identifier</label>
                                        <select class="form-control form-control-sm-custom" id="dms_instance_id" name="dms_instance_id" required>
                                            <option value="">Discover databases first</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <button type="button" class="btn btn-primary btn-sm-custom mr-2 mb-2" id="configure-dms-btn" disabled>
                                        <span class="spinner" id="configure-dms-spinner"></span>
                                        <span>Configure DMS Job</span>
                                    </button>
                                    <button type="button" class="btn btn-info btn-sm-custom mr-2 mb-2" id="start-dms-btn" disabled>
                                        <span class="spinner" id="start-dms-spinner"></span>
                                        <span>Start DMS Job</span>
                                    </button>
                                    <button type="button" class="btn btn-secondary btn-sm-custom mr-2 mb-2" id="status-dms-btn" disabled>
                                        <span class="spinner" id="status-dms-spinner"></span>
                                        <span>Check DMS Status</span>
                                    </button>
                                    <button type="button" class="btn btn-danger btn-sm-custom mr-2 mb-2" id="promote-dms-btn" disabled>
                                        <span class="spinner" id="promote-dms-spinner"></span>
                                        <span>Promote Database</span>
                                    </button>
                                    <button type="button" class="btn btn-success btn-sm-custom mb-2" id="validate-dms-btn" disabled>
                                        <span class="spinner" id="validate-dms-spinner"></span>
                                        <span>Validate Database</span>
                                    </button>
                                </div>
                                <div id="dms-result" class="mt-2"></div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="container-fluid" style="max-width: 1600px;">
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header card-header-sm">View Report</div>
                        <div class="card-body card-body-sm">
                            <div id="output">
                                <p class="text-muted">The generated DMS report will be displayed here.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const configureForm = document.getElementById('configure-form');
        const discoverBtn = document.getElementById('discover-btn');

        // DMS management elements
        const configureDmsBtn = document.getElementById('configure-dms-btn');
        const startDmsBtn = document.getElementById('start-dms-btn');
        const statusDmsBtn = document.getElementById('status-dms-btn');
        const promoteDmsBtn = document.getElementById('promote-dms-btn');
        const validateDmsBtn = document.getElementById('validate-dms-btn');
        const dmsInstanceSelect = document.getElementById('dms_instance_id');
        const dmsRegionSelect = document.getElementById('dms_region');

        configureForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const accountId = document.getElementById('aws_account_id').value;
            const accessKeyId = document.getElementById('aws_access_key_id').value;
            const secretAccessKey = document.getElementById('aws_secret_access_key').value;
            const configureResult = document.getElementById('configure-result');
            const discoverBtn = document.getElementById('discover-btn');
            const discoverPrompt = document.getElementById('discover-prompt');
            const configureBtn = document.getElementById('configure-btn');
            const spinner = document.getElementById('configure-spinner');
            const buttonText = document.getElementById('configure-button-text');

            configureResult.innerHTML = '';
            discoverBtn.disabled = true;
            discoverPrompt.disabled = true;
            configureBtn.disabled = true;
            spinner.style.display = 'inline-block';
            buttonText.textContent = 'Configuring...';

            try {
                const response = await fetch('/configure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        aws_account_id: accountId,
                        aws_access_key_id: accessKeyId,
                        aws_secret_access_key: secretAccessKey,
                    }),
                });
                const data = await response.json();

                if (response.ok) {
                    configureResult.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
                    discoverBtn.disabled = false;
                    discoverPrompt.disabled = false;
                } else {
                    configureResult.innerHTML = `<div class="alert alert-danger">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                configureResult.innerHTML = `<div class="alert alert-danger">An unexpected error occurred: ${error}</div>`;
            } finally {
                configureBtn.disabled = false;
                spinner.style.display = 'none';
                buttonText.textContent = 'Configure AWS';
            }
        });

        discoverBtn.addEventListener('click', async () => {
            const startTime = new Date();
            const outputDiv = document.getElementById('output');
            const prompt = document.getElementById('discover-prompt').value;
            const spinner = document.getElementById('discover-spinner');
            const buttonText = document.getElementById('discover-button-text');
            const discoverResult = document.getElementById('discover-result');

            outputDiv.innerHTML = '<p class="text-muted"><span class="clock-spinner">🕰️</span>Generating report, please wait...</p>';
            discoverResult.innerHTML = '';
            discoverBtn.disabled = true;
            spinner.style.display = 'inline-block';
            buttonText.textContent = 'Discovering...';

            try {
                const response = await fetch('/discover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt }),
                });
                const data = await response.json();

                if (response.ok && data.report_url) {
                    const reportResponse = await fetch(data.report_url);
                    if (reportResponse.ok) {
                        const reportHtml = await reportResponse.text();
                        outputDiv.innerHTML = `<iframe srcdoc="${reportHtml.replace(/"/g, '&quot;')}" style="width: 100%; height: 400px; border: none; border-radius: 8px;"></iframe>`;
                        const endTime = new Date();
                        const timeDiff = (endTime - startTime) / 1000; // time difference in seconds
                        const minutes = Math.floor(timeDiff / 60);
                        const seconds = Math.floor(timeDiff % 60);
                        discoverResult.innerHTML = `<div class="alert alert-success">Report generated successfully in ${minutes} minutes and ${seconds} seconds.</div>`;

                        // Populate migration dropdowns dynamically
                        dmsInstanceSelect.innerHTML = '<option value="">Select a database</option>';
                        dmsRegionSelect.innerHTML = '<option value="">Select a region</option>';
                        
                        const instances = data.instances || [];
                        const uniqueGcpRegions = new Set();
                        
                        const awsToGcpRegionMap = {
                            'ap-south-1': 'asia-south1',
                            'us-east-1': 'us-east1',
                            'us-east-2': 'us-east4',
                            'us-west-1': 'us-west1',
                            'us-west-2': 'us-west2',
                            'eu-west-1': 'europe-west1',
                            'eu-west-2': 'europe-west2',
                            'eu-central-1': 'europe-west3',
                            'ap-northeast-1': 'asia-northeast1',
                            'ap-northeast-2': 'asia-northeast3',
                            'ap-southeast-1': 'asia-southeast1',
                            'ap-southeast-2': 'asia-southeast2',
                            'ca-central-1': 'northamerica-northeast1',
                            'sa-east-1': 'southamerica-east1'
                        };
                        
                        instances.forEach(inst => {
                            const opt = document.createElement('option');
                            opt.value = inst.instance_id;
                            opt.textContent = `${inst.instance_id} (${inst.engine})`;
                            const gcpReg = awsToGcpRegionMap[inst.region] || 'us-central1';
                            opt.setAttribute('data-gcp-region', gcpReg);
                            opt.setAttribute('data-engine', inst.engine);
                            dmsInstanceSelect.appendChild(opt);
                            
                            uniqueGcpRegions.add(gcpReg);
                        });
                        
                        uniqueGcpRegions.forEach(gcpReg => {
                            const opt = document.createElement('option');
                            opt.value = gcpReg;
                            opt.textContent = gcpReg;
                            dmsRegionSelect.appendChild(opt);
                        });
                        
                        dmsInstanceSelect.addEventListener('change', () => {
                            const selectedOption = dmsInstanceSelect.options[dmsInstanceSelect.selectedIndex];
                            if (selectedOption && selectedOption.value) {
                                const gcpRegion = selectedOption.getAttribute('data-gcp-region');
                                if (gcpRegion) {
                                    dmsRegionSelect.value = gcpRegion;
                                }
                                configureDmsBtn.disabled = false;
                            } else {
                                configureDmsBtn.disabled = true;
                                startDmsBtn.disabled = true;
                                statusDmsBtn.disabled = true;
                                promoteDmsBtn.disabled = true;
                                validateDmsBtn.disabled = true;
                                stopDmsPolling();
                            }
                        });
                    } else {
                        discoverResult.innerHTML = `<div class="alert alert-danger">Error fetching report: ${reportResponse.status} ${reportResponse.statusText}</div>`;
                    }
                } else {
                    let errorMsg = `Error: ${data.detail || 'Unknown error'}`;
                    if (data.text) {
                        errorMsg += `<br><pre>${data.text}</pre>`;
                    }
                    discoverResult.innerHTML = `<div class="alert alert-danger">${errorMsg}</div>`;
                }
            } catch (error) {
                discoverResult.innerHTML = `<div class="alert alert-danger">An unexpected error occurred: ${error}</div>`;
            } finally {
                discoverBtn.disabled = false;
                spinner.style.display = 'none';
                buttonText.textContent = 'Discover Databases';
            }
        });

        // --- DMS Button State & Polling Helpers ---
        let dmsPollInterval = null;

        function updateDmsButtonsState(status) {
            if (!status.configured) {
                configureDmsBtn.disabled = !dmsInstanceSelect.value;
                startDmsBtn.disabled = true;
                statusDmsBtn.disabled = true;
                promoteDmsBtn.disabled = true;
                validateDmsBtn.disabled = true;
                return;
            }
            
            configureDmsBtn.disabled = false;
            startDmsBtn.disabled = false;
            statusDmsBtn.disabled = false;
            validateDmsBtn.disabled = false;
            
            if (status.state === 'RUNNING' && status.phase === 'CDC' && status.lag === 0) {
                promoteDmsBtn.disabled = false;
            } else {
                promoteDmsBtn.disabled = true;
            }
            
            if (status.promoted || status.state === 'COMPLETED') {
                configureDmsBtn.disabled = true;
                startDmsBtn.disabled = true;
                statusDmsBtn.disabled = true;
                promoteDmsBtn.disabled = true;
                validateDmsBtn.disabled = true;
            }
        }

        function startDmsPolling(jobName, region) {
            if (dmsPollInterval) clearInterval(dmsPollInterval);
            checkJobStatusAndUpdate(jobName, region);
            dmsPollInterval = setInterval(() => {
                checkJobStatusAndUpdate(jobName, region);
            }, 5 * 60 * 1000); // Poll every 5 minutes
        }

        function stopDmsPolling() {
            if (dmsPollInterval) {
                clearInterval(dmsPollInterval);
                dmsPollInterval = null;
            }
        }

        async function checkJobStatusAndUpdate(jobName, region) {
            try {
                const response = await fetch('/dms/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_name: jobName, region: region })
                });
                if (response.ok) {
                    const status = await response.json();
                    updateDmsButtonsState(status);

                    const resultDiv = document.getElementById('dms-result');
                    let adviceHtml = '';
                    if (status.state === 'RUNNING' && status.phase === 'CDC' && status.lag === 0) {
                        adviceHtml = '<div class="alert alert-success mt-2"><strong>Status Advice:</strong> The database migration job is in CDC status and replication lag is 0. The target database is ready for Promotion!</div>';
                    } else if (status.state === 'RUNNING') {
                        adviceHtml = `<div class="alert alert-warning mt-2"><strong>Status Advice:</strong> The migration job is running (Phase: ${status.phase}, Lag: ${status.lag}s). Wait for the phase to reach CDC and lag to become 0 before promoting.</div>`;
                    } else if (status.state === 'COMPLETED' || status.promoted) {
                        adviceHtml = '<div class="alert alert-success mt-2"><strong>Status Advice:</strong> The database has been promoted successfully. Migration complete!</div>';
                    } else if (status.state === 'NOT_STARTED') {
                        adviceHtml = '<div class="alert alert-info mt-2"><strong>Status Advice:</strong> Job has been configured. Click "Start DMS Job" to begin replication.</div>';
                    } else {
                        adviceHtml = `<div class="alert alert-secondary mt-2"><strong>Status Advice:</strong> Migration job status is currently: ${status.state}.</div>`;
                    }
                    
                    // If resultDiv has content, append or wrap advice
                    if (resultDiv.innerHTML) {
                        // Check if an existing advice block is there, if so, replace it, otherwise append.
                        const adviceMatch = resultDiv.innerHTML.indexOf('Status Advice:');
                        if (adviceMatch !== -1) {
                            // Clear and reset advice
                            resultDiv.innerHTML = resultDiv.innerHTML.split('<div class="alert alert-')[0] + adviceHtml;
                        } else {
                            resultDiv.innerHTML += adviceHtml;
                        }
                    } else {
                        resultDiv.innerHTML = adviceHtml;
                    }

                    if (status.promoted || status.state === 'COMPLETED') {
                        stopDmsPolling();
                    }
                }
            } catch (error) {
                console.error("Error polling DMS status:", error);
            }
        }

        // --- GCP DMS Migration Event Listeners ---
        async function callDmsAgent(prompt, buttonId, spinnerId) {
            const btn = document.getElementById(buttonId);
            const spinner = document.getElementById(spinnerId);
            const resultDiv = document.getElementById('dms-result');
            
            resultDiv.innerHTML = '<div class="alert alert-info">DMS Agent is executing the task. This can take several minutes for setup...</div>';
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            
            try {
                const response = await fetch('/configuredms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await response.json();
                
                if (response.ok) {
                    let output = data.output;
                    const formattedOutput = output.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    resultDiv.innerHTML = `<div class="alert alert-success">${formattedOutput}</div>`;
                    return true;
                } else {
                    let errDetail = data.detail?.error || data.detail || 'Request failed';
                    if (typeof errDetail === 'object') {
                        errDetail = JSON.stringify(errDetail);
                    }
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${errDetail}</div>`;
                    return false;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">An unexpected error occurred: ${error}</div>`;
                return false;
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        document.getElementById('configure-dms-btn').addEventListener('click', async () => {
            const jobName = document.getElementById('dms_job_name').value;
            const region = document.getElementById('dms_region').value;
            const instanceId = document.getElementById('dms_instance_id').value;

            if (!jobName || !region || !instanceId) {
                alert("Please fill in all fields (Job Name, GCP Region, and Source Database Instance Identifier).");
                return;
            }

            const prompt = `Configure a continuous DMS job named ${jobName} in region ${region} for source database ${instanceId}.`;
            const success = await callDmsAgent(prompt, 'configure-dms-btn', 'configure-dms-spinner');
            if (success) {
                updateDmsButtonsState({
                    configured: true,
                    state: 'NOT_STARTED',
                    phase: 'FULL_LOAD',
                    lag: 0,
                    promoted: false
                });
            }
        });

        document.getElementById('start-dms-btn').addEventListener('click', async () => {
            const jobName = document.getElementById('dms_job_name').value;
            const region = document.getElementById('dms_region').value;
            if (!jobName) {
                alert("Please specify the DMS Migration Job Name.");
                return;
            }
            const prompt = `Start database migration job ${jobName} in region ${region}.`;
            const success = await callDmsAgent(prompt, 'start-dms-btn', 'start-dms-spinner');
            if (success) {
                startDmsPolling(jobName, region);
            }
        });

        document.getElementById('status-dms-btn').addEventListener('click', async () => {
            const jobName = document.getElementById('dms_job_name').value;
            const region = document.getElementById('dms_region').value;
            if (!jobName) {
                alert("Please specify the DMS Migration Job Name.");
                return;
            }
            const prompt = `Check status of database migration job ${jobName} in region ${region}.`;
            await callDmsAgent(prompt, 'status-dms-btn', 'status-dms-spinner');
            checkJobStatusAndUpdate(jobName, region);
        });

        document.getElementById('promote-dms-btn').addEventListener('click', async () => {
            const jobName = document.getElementById('dms_job_name').value;
            const region = document.getElementById('dms_region').value;
            if (!jobName) {
                alert("Please specify the DMS Migration Job Name.");
                return;
            }
            const prompt = `Promote target database migration job ${jobName} in region ${region}.`;
            const success = await callDmsAgent(prompt, 'promote-dms-btn', 'promote-dms-spinner');
            if (success) {
                stopDmsPolling();
                updateDmsButtonsState({
                    configured: true,
                    state: 'COMPLETED',
                    phase: 'CDC',
                    lag: 0,
                    promoted: true
                });
            }
        });

        document.getElementById('validate-dms-btn').addEventListener('click', async () => {
            const instanceSelect = document.getElementById('dms_instance_id');
            const selectedOption = instanceSelect.options[instanceSelect.selectedIndex];
            
            if (!selectedOption || !selectedOption.value) {
                alert("Please select a database instance first.");
                return;
            }
            
            const instanceId = selectedOption.value;
            const engine = selectedOption.getAttribute('data-engine') || 'postgres';
            
            const btn = document.getElementById('validate-dms-btn');
            const spinner = document.getElementById('validate-dms-spinner');
            const resultDiv = document.getElementById('dms-result');
            
            resultDiv.innerHTML = '<div class="alert alert-info">Connecting to target Cloud SQL and querying schema structures. Please wait...</div>';
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            
            try {
                const response = await fetch('/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instance_id: instanceId, engine: engine })
                });
                const data = await response.json();
                
                if (response.ok) {
                    let html = '<div class="alert alert-success">';
                    html += '<h5 class="mb-2"><strong>Database Validation Report</strong></h5>';
                    if (data.databases && data.databases.length > 0) {
                        data.databases.forEach(db => {
                            html += `<div class="mt-3"><strong>Database Name:</strong> <code class="text-dark bg-light px-2 py-1 rounded">${db.name}</code>`;
                            if (db.error) {
                                html += `<div class="text-danger mt-1">Failed to query details: ${db.error}</div>`;
                            } else if (db.schemas) {
                                db.schemas.forEach(sch => {
                                    html += `<div class="ml-3 mt-2"><strong>Schema:</strong> <code>${sch.name}</code>`;
                                    if (sch.tables && sch.tables.length > 0) {
                                        html += '<table class="table table-sm table-bordered mt-2 bg-white" style="max-width: 600px; font-size: 0.9rem;">';
                                        html += '<thead class="thead-light"><tr><th>Table Name</th><th class="text-right">Row Count</th></tr></thead><tbody>';
                                        sch.tables.forEach(tbl => {
                                            const rowCountText = tbl.rows === -1 ? '<span class="text-warning">Count Error</span>' : tbl.rows.toLocaleString();
                                            html += `<tr><td>${tbl.name}</td><td class="text-right">${rowCountText}</td></tr>`;
                                        });
                                        html += '</tbody></table>';
                                    } else {
                                        html += '<div class="text-muted ml-3 mt-1">No tables found.</div>';
                                    }
                                    html += '</div>';
                                });
                            }
                            html += '</div><hr class="my-2">';
                        });
                    } else {
                        html += '<div>No databases found.</div>';
                    }
                    html += '</div>';
                    resultDiv.innerHTML = html;
                } else {
                    let errDetail = data.detail?.error || data.detail || 'Validation failed';
                    if (typeof errDetail === 'object') {
                        errDetail = JSON.stringify(errDetail);
                    }
                    resultDiv.innerHTML = `<div class="alert alert-danger"><strong>Error:</strong> ${errDetail}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger"><strong>An unexpected error occurred:</strong> ${error}</div>`;
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
